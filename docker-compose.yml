version: '3.9'

services:

  # ── Databases ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres        # each service creates its own DB via Prisma
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - collab_net

  mongodb:
    image: mongo:7-jammy
    container_name: ce_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - collab_net

  redis:
    image: redis:7-alpine
    container_name: ce_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - collab_net

